---
# EDIN Backend Configuration
# ===========================

# Source repo (cloned on server for Docker builds)
control_api_repo_url: "git@github.com:davidmoore-io/edin-backend.git"
control_api_repo_branch: main
control_api_src_dir: /srv/edin-backend/src

# Control API
control_api_dir: /srv/control-api
control_api_env_file: /srv/control-api/control-api.env
control_api_compose_file: /srv/control-api/docker-compose.yml

# Discord Bot
discord_bot_dir: /srv/discord-bot
discord_bot_env_file: /srv/discord-bot/discord-bot.env
discord_bot_compose_file: /srv/discord-bot/docker-compose.yml
discord_app_id: "1438245266817028169"

# Galaxy Exporter
galaxy_exporter_output_dir: /srv/galaxy
galaxy_exporter_binary_path: /usr/local/bin/galaxy-exporter
galaxy_exporter_timer_interval: 15min
galaxy_exporter_batch_size: 50000
galaxy_exporter_history_cycles: 12

# Database connections (Docker network hostnames — no VPN needed)
memgraph_host: memgraph
memgraph_port: 7687
edin_db_host: edin-timescaledb
edin_db_port: 5432
eddn_db_host: eddn-timescaledb
eddn_db_port: 5432

# VPN address (galaxy exporter runs on host, needs VPN-bound ports)
vpn_interface_address: "10.8.0.6"

# Docker networks
edin_app_network: edin-app-net
edin_data_network: edin-data-net

# Redis
redis_image: redis:7-alpine
redis_port: 6379

# Kaine auth (Authentik on edin.space)
kaine_auth_enabled: "true"
kaine_auth_jwks_url: "https://auth.edin.space/application/o/kaine-portal/jwks/"
kaine_auth_issuer: "https://auth.edin.space/application/o/kaine-portal/"
kaine_auth_audience: "kaine-portal"

# Domain
edin_domain: edin.space

# TimescaleDB superuser access — used for DB role provisioning (db_roles.yml)
# NOTE: edin_db_host is a Docker network name (edin-timescaledb) — only reachable
# from within Docker. For Ansible running on the host, use the VPN address instead.
timescaledb_admin_host: "{{ vpn_interface_address }}"
# The TimescaleDB container is initialised with POSTGRES_USER=edin_admin, so that
# role (not the default 'postgres') is the cluster superuser.
timescaledb_superuser: edin_admin

# Commander DB role credentials (values stored in ansible-vault encrypted creds.yml)
vault_edin_cmd_writer_password: "{{ vault_edin_cmd_writer_password }}"
vault_edin_cmd_reader_password: "{{ vault_edin_cmd_reader_password }}"
vault_edin_migrator_password: "{{ vault_edin_migrator_password }}"
vault_timescaledb_superuser_password: "{{ vault_timescaledb_superuser_password }}"

# Commander auth
commander_auth_enabled: "true"
commander_jwt_private_key_path: /srv/control-api/keys/commander-private.pem
commander_jwt_public_key_path: /srv/control-api/keys/commander-public.pem
commander_jwt_issuer: edin-space
commander_jwt_expiry: 24h
commander_cookie_domain: .edin.space
commander_cookie_secure: "true"
frontier_auth_url: https://auth.frontierstore.net
frontier_capi_url: https://companion.orerve.net
frontier_scope: "auth capi"
frontier_capi_timeout: 10s
pkce_state_ttl: 10m
pkce_max_pending: 1000
commander_nonce_expiry: 10s
commander_auth_initiate_rate_limit: 5
commander_auth_initiate_rate_window: 1m

# Copilot WebSocket tuning
copilot_ws_auth_timeout: 5s
copilot_ws_read_deadline: 60s
copilot_ws_ping_interval: 30s
copilot_ws_write_deadline: 10s
copilot_ws_read_limit_bytes: 65536
copilot_message_history_limit: 20
copilot_events_default_limit: 20
copilot_events_max_limit: 100
