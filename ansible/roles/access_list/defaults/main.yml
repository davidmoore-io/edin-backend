---
# access_list role — first-cut commander allowlist for the copilot / ingest /
# query endpoints. The backend refuses to mint an EDIN JWT for any Frontier
# customer whose FID is not in this list, logs the attempt to
# commander_login_attempt_log, and returns a 403 to the caller.
#
# FIDs are non-secret (they're visible in any commander's journal and in any
# EDIN JWT this backend issues), so they live in plain group vars rather than
# in ansible-vault.
#
# Empty list = allow everyone. Useful for dev; a meaningful deployment should
# always have at least one FID here.
commander_fid_allowlist:
  - F2504   # Pattern State (David)

# Where the backend writes rejected login attempts as one JSON object per
# line. Lives under /var/log/ — the conventional Linux location for system
# and service logs, independent of any container rebuild. The access_list
# role ensures the directory exists on the host with the right perms, and
# the control_api docker-compose template bind-mounts it read-write into
# the container so writes land on the host filesystem, not in the container
# overlay (where they'd be lost on the next deploy).
commander_login_attempt_log: /var/log/edin/login-attempts.log
