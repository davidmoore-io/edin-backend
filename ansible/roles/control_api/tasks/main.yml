---
# Control API — REST + MCP server for EDIN platform

- name: Ensure control API directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: '0755'
  loop:
    - { path: "{{ control_api_dir }}" }
    - { path: "{{ control_api_src_dir | dirname }}", owner: "{{ ansible_user }}", group: "{{ ansible_user }}" }
    # Parent of the personality clone — owned by the connecting user so the
    # `git clone` below (run with become: false) can create the checkout.
    - { path: "{{ personality_src_dir | dirname }}", owner: "{{ ansible_user }}", group: "{{ ansible_user }}" }
  tags: [control_api, directories]

# Personality templates — clone/pull from main, mirroring the backend source
# tasks. Run as the connecting user (become: false) so the SSH deploy key is used.
- name: Check if personality repo exists
  ansible.builtin.stat:
    path: "{{ personality_src_dir }}/.git"
  register: personality_repo_state
  become: false
  tags: [control_api, personality]

- name: Clone personality repo
  ansible.builtin.command:
    cmd: "git clone --branch {{ personality_repo_branch }} {{ personality_repo_url }} {{ personality_src_dir }}"
    creates: "{{ personality_src_dir }}/.git"
  become: false
  environment:
    GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new"
  when: not personality_repo_state.stat.exists
  tags: [control_api, personality]

- name: Pull latest personality templates
  ansible.builtin.command:
    cmd: "git pull origin {{ personality_repo_branch }}"
    chdir: "{{ personality_src_dir }}"
  become: false
  environment:
    GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new"
  when: personality_repo_state.stat.exists
  register: personality_pull
  changed_when: "'Already up to date' not in personality_pull.stdout"
  tags: [control_api, personality]

- name: Ensure edin-app Docker network exists
  community.docker.docker_network:
    name: "{{ edin_app_network }}"
    state: present
  tags: [control_api, network]

# Git clone (must run as connecting user for SSH deploy key)
- name: Check if backend repo exists
  ansible.builtin.stat:
    path: "{{ control_api_src_dir }}/.git"
  register: backend_repo_state
  become: false
  tags: [control_api, source]

- name: Clone backend repo
  ansible.builtin.command:
    cmd: "git clone --branch {{ control_api_repo_branch }} {{ control_api_repo_url }} {{ control_api_src_dir }}"
    creates: "{{ control_api_src_dir }}/.git"
  become: false
  environment:
    GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new"
  when: not backend_repo_state.stat.exists
  tags: [control_api, source]

- name: Pull latest backend code
  ansible.builtin.command:
    cmd: "git pull origin {{ control_api_repo_branch }}"
    chdir: "{{ control_api_src_dir }}"
  become: false
  environment:
    GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new"
  when: backend_repo_state.stat.exists
  register: git_pull
  changed_when: "'Already up to date' not in git_pull.stdout"
  tags: [control_api, source]

# Environment and compose
- name: Template control API environment file
  ansible.builtin.template:
    src: control-api.env.j2
    dest: "{{ control_api_env_file }}"
    owner: root
    group: root
    mode: '0600'
  notify: Restart control API
  tags: [control_api, config]

- name: Template control API compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ control_api_compose_file }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart control API
  tags: [control_api, compose]

# Build and start.
# SAFETY: these commands only affect containers defined in control_api_compose_file
# (/srv/control-api/docker-compose.yml). All other services — memgraph, Redis,
# TimescaleDB, Authentik — are in separate compose files on separate networks and
# are never touched. No `down` and no `-v` flag appear anywhere in this playbook;
# volumes are only destroyed by `docker compose down -v` which we never run here.
#
# We always --no-cache the build step so Go source changes are never silently
# skipped by Docker's layer cache. The build and up steps are intentionally
# separate: `build` only rebuilds the image; `up -d` recreates only containers
# whose image changed, preserving all volumes.
- name: Build control API image (no cache)
  ansible.builtin.command:
    cmd: "docker compose -f {{ control_api_compose_file }} build --no-cache control-api"
  register: api_build
  changed_when: true
  tags: [control_api, deploy]

- name: Start control API
  ansible.builtin.command:
    cmd: "docker compose -f {{ control_api_compose_file }} up -d --remove-orphans"
  register: api_up
  changed_when: "'Started' in api_up.stderr or 'Recreated' in api_up.stderr or 'Created' in api_up.stderr"
  tags: [control_api, deploy]

- name: Wait for control API health
  ansible.builtin.uri:
    url: "http://127.0.0.1:8080/health"
    method: GET
    status_code: [200]
  register: api_health
  retries: 10
  delay: 5
  until: api_health is not failed
  failed_when: false
  tags: [control_api, verify]

# Database role provisioning — run explicitly with --tags db_roles (NOT included in normal deploys).
# Requires timescaledb_admin_host to be reachable and vault_timescaledb_superuser_password set.
- name: Include DB role provisioning tasks
  ansible.builtin.import_tasks: db_roles.yml
  tags: [db_roles]

# Commander JWT keypair provisioning — run explicitly with --tags jwt_keygen (first-time only).
# Tasks inside are tagged [never, jwt_keygen] so normal deploys skip them entirely.
- name: Include commander JWT keygen tasks
  ansible.builtin.import_tasks: keygen.yml
  tags: [never, jwt_keygen]
