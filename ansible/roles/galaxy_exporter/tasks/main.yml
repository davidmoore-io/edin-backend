---
# Galaxy Exporter — generates binary galaxy map data on a timer

- name: Ensure galaxy output directory exists
  ansible.builtin.file:
    path: "{{ galaxy_exporter_output_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: [galaxy_exporter, directories]

- name: Cross-compile galaxy exporter binary (macOS → linux/amd64)
  ansible.builtin.command:
    cmd: "go build -o /tmp/galaxy-exporter-linux ./cmd/galaxy-exporter"
    # playbook_dir = edin-backend/ansible/, so ../ lands at edin-backend/
    # which is the Go module root containing cmd/galaxy-exporter/.
    chdir: "{{ playbook_dir }}/../"
  environment:
    CGO_ENABLED: "0"
    GOOS: linux
    GOARCH: amd64
  delegate_to: localhost
  become: false
  register: build_result
  changed_when: build_result.rc == 0
  tags: [galaxy_exporter, build]

- name: Copy galaxy exporter binary to server
  ansible.builtin.copy:
    src: /tmp/galaxy-exporter-linux
    dest: "{{ galaxy_exporter_binary_path }}"
    owner: root
    group: root
    mode: '0755'
  notify: Restart galaxy exporter timer
  tags: [galaxy_exporter, deploy]

- name: Template galaxy exporter systemd service
  ansible.builtin.template:
    src: galaxy-exporter.service.j2
    dest: /etc/systemd/system/galaxy-exporter.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart galaxy exporter timer
  tags: [galaxy_exporter, service]

- name: Template galaxy exporter systemd timer
  ansible.builtin.template:
    src: galaxy-exporter.timer.j2
    dest: /etc/systemd/system/galaxy-exporter.timer
    owner: root
    group: root
    mode: '0644'
  notify: Restart galaxy exporter timer
  tags: [galaxy_exporter, service]

- name: Enable and start galaxy exporter timer
  ansible.builtin.systemd:
    name: galaxy-exporter.timer
    state: started
    enabled: true
    daemon_reload: true
  when: galaxy_exporter_enabled
  tags: [galaxy_exporter, service]

# Disabled path: keep the binary and unit files up to date on disk (so a future
# re-enable is just a flag flip, no rebuild) but stop and mask the timer + any
# in-flight service run. See group_vars/all.yml for the rationale on why this
# is currently disabled.
- name: Stop and disable galaxy exporter timer
  ansible.builtin.systemd:
    name: galaxy-exporter.timer
    state: stopped
    enabled: false
    daemon_reload: true
  when: not galaxy_exporter_enabled
  tags: [galaxy_exporter, service]

- name: Stop galaxy exporter service if a run is in flight
  ansible.builtin.systemd:
    name: galaxy-exporter.service
    state: stopped
  when: not galaxy_exporter_enabled
  failed_when: false
  tags: [galaxy_exporter, service]
