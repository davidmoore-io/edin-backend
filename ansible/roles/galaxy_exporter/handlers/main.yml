---
# Handlers fire only when the corresponding task reports `changed`. The
# notify-points are: binary copy (tasks/main.yml:27), service unit template
# (line 37), timer unit template (line 47). All three need the timer
# restarted with a fresh systemd daemon-reload so unit-file changes apply.

- name: Restart galaxy exporter timer
  ansible.builtin.systemd:
    name: galaxy-exporter.timer
    state: restarted
    enabled: true
    daemon_reload: true
